name: Source checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install GUI asset build dependency
        run: python -m pip install Pillow==11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FireCrackle/package-lock.json
      - name: Repository boundaries
        run: |
          node --test scripts/check-repository.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-repository.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: FireCrackle/.release-cache
          key: ffmpeg-${{ hashFiles('FireCrackle/release/runtime-lock.json') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            FireCrackle/src-tauri
            FireCrackle/crates/studio_core
            fire-detection/core
          shared-key: ci-windows
      - name: Prepare pinned video tools
        run: |
          python FireCrackle/scripts/prepare-no-fire.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./FireCrackle/scripts/prepare-runtime.ps1
          "$PWD/FireCrackle/src-tauri/runtime" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Model and runtime packaging regressions
        run: python -m unittest discover -s FireCrackle/scripts -p 'test_*no_fire.py'
      - name: Shared unveil WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Frontend tests and production build
        working-directory: FireCrackle
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Rust source and tests
        run: |
          $crates = @('FireCrackle/crates/studio_core/Cargo.toml', 'fire-detection/core/Cargo.toml', 'FireCrackle/crates/no_fire_cnn/Cargo.toml', 'FireCrackle/src-tauri/Cargo.toml')
          foreach ($crate in $crates) {
            cargo fmt --manifest-path $crate -- --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --manifest-path $crate --all-targets --no-deps -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --manifest-path $crate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Packaging script regression checks
        run: ./FireCrackle/scripts/release.test.ps1
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: fire-detection/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r fire-detection/requirements.txt
      - run: python -m pip install pillow
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest fire-detection/obs fire-detection/augment fire-detection/bench FireCrackle/scripts/test_actual_quad_geometry.py FireCrackle/scripts/test_runtime_lock.py
  recording-mod:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Test original mod source (upstream dependencies stay in local caches)
        working-directory: fire-detection/mod
        run: bash ./gradlew test build --no-daemon
      - name: Build the GUI recording mod (1.21.11)
        working-directory: fire-detection/mod-gui
        run: bash ./gradlew build --no-daemon
      - name: Build the HUD timing mod (1.21.11)
        working-directory: fire-detection/mod-hud
        run: bash ./gradlew build --no-daemon
