name: FireCrackle release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Packages to build
        type: choice
        options: [all, windows, linux]
        default: all
      publish:
        description: Publish after both platform builds pass (requires platform=all)
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release safety regressions
        run: python3 -m unittest discover -s FireCrackle/scripts -p 'test_*release.py'
      - name: Check version and publication plan
        id: version
        run: python3 FireCrackle/scripts/publish_release.py validate --platform "${{ inputs.platform || 'all' }}" --publish "${{ github.event_name == 'push' || inputs.publish }}" --ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"
  windows:
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: FireCrackle
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FireCrackle/package-lock.json
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          rustup target add wasm32-unknown-unknown
      # Dependencies are restored, not recompiled (the main branch keeps the cache warm; see rust-cache-warm.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: FireCrackle/src-tauri
          shared-key: release-windows
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: FireCrackle/.release-cache
          key: ffmpeg-${{ hashFiles('FireCrackle/release/runtime-lock.json') }}
      - name: Build and package
        run: ./scripts/release.ps1 -Installer -CleanInstall
      - name: Upload tester downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FireCrackle-windows-x64
          path: |
            FireCrackle/releases/**/*.zip
            FireCrackle/releases/**/*-Setup.exe
            FireCrackle/releases/**/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  linux:
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        working-directory: FireCrackle
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FireCrackle/package-lock.json
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils ffmpeg xvfb dbus-x11
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: FireCrackle/src-tauri
          shared-key: release-linux
      - name: Build, test and verify Linux packages
        run: bash scripts/release-linux.sh
      - name: Upload Linux tester downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FireCrackle-linux-x64
          path: FireCrackle/releases/**/linux-x64-*/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [validate, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify both platforms and publish through a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 FireCrackle/scripts/publish_release.py publish --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --windows-run "$GITHUB_RUN_ID" --linux-run "$GITHUB_RUN_ID"
