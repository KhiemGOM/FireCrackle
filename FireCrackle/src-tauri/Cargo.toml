[package]
name = "firecrackle"
version = "0.6.2"
description = "Frame-by-frame Minecraft fire annotation and animation timing analysis"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "firecrackle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# A plain `cargo build` (or `cargo run`) embeds the built frontend from ../dist, like `tauri build`.
# Only the dev server is opt-in: `npm run tauri:dev` builds with `--no-default-features` and loads devUrl.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
studio_core = { path = "../crates/studio_core" }
no_fire_cnn = { path = "../crates/no_fire_cnn" }
# serde: the GUI scan journal stores the engine's results as they are
fire_core = { path = "../../fire-detection/core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"


[dev-dependencies]
# test PNGs for the first-person frame match (the same png crate studio_core decodes with)
png = "0.18"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Interactive development must not run the per-frame detector as unoptimized Rust.
[profile.dev.package.fire_core]
opt-level = 3

[profile.dev.package.no_fire_cnn]
opt-level = 3
