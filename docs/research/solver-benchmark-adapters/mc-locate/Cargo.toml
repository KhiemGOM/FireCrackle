[package]
name = "mc-locate-bench-adapter"
version = "0.1.0"
edition = "2024"
publish = false

# Only mc-locate's camera solver (src/pose.rs lines 1-911 of LAOUUUUU/mc-locate@ca0d694, verbatim except the two
# `use crate::session/ui` lines, which only the interactive CLI part needs). Same nalgebra version as their Cargo.lock;
# default features off so no nalgebra-macros proc-macro is built (pose.rs does not use the macros).
[dependencies]
anyhow = "1.0.104"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
